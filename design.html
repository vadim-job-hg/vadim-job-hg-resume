<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Design Prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 1200px; /* Fixed width for vertical A4 page */
            margin: 0 auto; /* Remove top margin for flush header */
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            border-radius: 8px;
            padding: 0;
            position: relative;
        }
        .header {
            position: relative;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ccc;
            height: 185px;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .bookmark {
            position: absolute;
            width: 110px;
            height: 235px;
            background-image: url('./src/assets/pdf/bookmark.png');
            background-repeat: no-repeat;
            background-size: 100% 100%; /* Stretch image to fit new size */
            background-position: bottom center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            left: 50px;
            top: 0;
            z-index: 10000;
        }
        .bookmark span {
            color: #fff;
            font-size: 50px;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.25);
            width: 100%;
            text-align: center;
            letter-spacing: 2px;
        }
        .logo span {
            line-height: 1;
        }
        .title {
            font-size: 60px;
            font-weight: 700;
            padding: 0;
            margin: 0 0 0 200px;
            text-align: left;
            line-height: 1;
            height: 48px;
            display: flex;
            align-items: center;
        }
        .content-split {
            display: flex;
            width: 100%;
            min-height: 600px;
        }
        .left-panel, .right-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .left-section, .right-section {
            flex: 1 1 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: #fff;
        }
        .left-section:not(:last-child), .right-section:not(:last-child) {
            border-bottom: 1px solid #ccc;
        }
        .left-panel {
            width: 415px;
            min-height: 600px;
            border-right: 1px solid #ccc;
            box-sizing: border-box;
        }
        .right-panel {
            flex: 1;
            min-height: 600px;
        }
        @media (max-width: 800px) {
            .container {
                width: 100%;
                padding: 8px;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bookmark">
          <span>V</span>
          <span>K</span>
        </div>
        <div class="header">
            <h1 class="title">VADYM KUZNETSOV</h1>
        </div>
        <div class="content-split">
            <div class="left-panel">
                <div class="left-section section-1">Left 1: Lorem ipsum dolor sit amet.</div>
                <div class="left-section section-2">Left 2: Consectetur adipiscing elit.</div>
                <div class="left-section section-3">Left 3: Integer nec odio. Praesent libero.</div>
            </div>
            <div class="right-panel">
                <div class="right-section section-1">Right 1: Sed cursus ante dapibus diam.</div>
                <div class="right-section section-2">Right 2: Nulla quis sem at nibh elementum imperdiet.</div>
                <div class="right-section section-3">Right 3: Duis sagittis ipsum. Praesent mauris.</div>
            </div>
        </div>
    </div>
</body>
</html>
