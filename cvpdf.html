<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vadym Kuznetsov - Resume</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 794px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 0;
      position: relative;
    }
    .header {
      position: relative;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ccc;
      height: 122px;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .bookmark {
      position: absolute;
      width: 73px;
      height: 156px;
      background-image: url('./src/assets/pdf/bookmark.png');
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: bottom center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      left: 33px;
      top: 0;
      z-index: 10000;
    }
    .bookmark span {
      color: #fff;
      font-size: 33px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      width: 100%;
      text-align: center;
      letter-spacing: 2px;
    }
    .title {
      font-size: 40px;
      font-weight: 700;
      padding: 0;
      margin: 0 0 0 130px;
      text-align: left;
      line-height: 1;
      height: 32px;
      display: flex;
      align-items: center;
    }
    .content-split {
      display: flex;
      width: 100%;
      min-height: 400px;
    }
    .left-panel,
    .right-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .section {
      flex: 1 1 0;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      font-size: 12px;
      background: #fff;
      box-sizing: border-box;
      min-height: 27px;
      border-bottom: 1px solid #ccc;
    }
    .section:last-child {
      border-bottom: none;
    }
    .section {
      padding-top: 33px;
      padding-bottom: 40px;
    }
    .left-section {
      padding-left: 56px;
      padding-right: 27px;
    }
    .right-section {
      flex: 0 1 auto;
      padding-left: 27px !important;
      padding-right: 60px !important;
    }
    .section-1.left-section {
      padding-top: 73px;
      height: 370px;
      min-height: 370px;
      max-height: 370px;
      overflow: hidden;
    }
    .section-2.left-section {
      height: 232px;
      min-height: 232px;
      max-height: 232px;
      overflow: hidden;
    }
    .section-3.left-section {
      display: flex;
      flex-direction: column;
      height: 270px;
      min-height: 270px;
      max-height: 270px;
      overflow: hidden;
      border-bottom: 1px solid #ccc;
    }
    .left-panel {
      width: 275px;
      min-height: 270px;
      border-right: 1px solid #ccc;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .left-section-bottom {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding-top: 33px;
    }
    .right-panel {
      flex: 1;
      min-height: 270px;
    }
    .info-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .info-item {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .info-icon {
      font-size: 15px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: inherit;
      filter: none;
      font-weight: 700;
    }
    .info-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.5;
    }
    .info-item:nth-child(2) .info-icon {
      filter: grayscale(1) brightness(0.7);
      opacity: 0.7;
    }
    .info-item:last-child .info-icon {
      background: transparent;
      color: #1976d2;
      filter: none;
      opacity: 1;
    }
    .info-text {
      text-align: justify;
    }
    .info-main {
      font-size: 10px;
      color: #000;
      font-weight: 500;
    }
    .info-label {
      font-size: 8px;
      color: #888;
    }
    .email-link {
      color: #000;
      text-decoration: none;
    }
    .phone-link {
      color: #000;
      text-decoration: none;
    }
    .section-title {
      font-size: 13px;
      font-weight: 400;
      margin-bottom: 16px;
      color: #000;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .lang-list-block {
      width: 100%;
    }
    .lang-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .lang-item {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .lang-avatar {
      width: 24px;
      height: 24px;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-weight: 700;
    }
    .lang-info {
      display: flex;
      flex-direction: column;
    }
    .lang-name {
      font-size: 10px;
      color: #000;
      font-weight: 500;
    }
    .lang-level {
      font-size: 8px;
      color: #888;
      text-align: justify;
    }
    .skills-block {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-content: flex-start;
      justify-content: flex-start;
      flex: 1;
    }
    .skill-badge {
      background: transparent;
      color: #222;
      font-size: 9px;
      font-weight: 700;
      padding: 0;
      margin: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      min-width: 40px;
    }
    .skill-text {
      display: block;
      line-height: 1;
    }
    .content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 0;
      padding: 0;
      width: 100%;
    }
    .heading {
      margin-bottom: 16px;
      letter-spacing: 2px;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      border: none;
      padding: 0;
      margin-left: 0;
      color: #222;
    }
    .card {
      background: none;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
      margin-bottom: 21px;
      margin-left: 0;
      width: 100%;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 0;
      color: #222;
      border: none;
      padding: 0;
      letter-spacing: 0;
      text-transform: none;
      flex: 1;
    }
    .card-period {
      font-style: italic;
      font-size: 11px;
      color: #666;
      text-align: right;
      flex-shrink: 0;
      min-width: 93px;
    }
    .card-subtitle {
      font-style: italic;
      font-size: 12px;
      color: #666;
      margin-bottom: 7px;
    }
    .card-description {
      font-size: 14px;
      color: #444;
      margin-bottom: 8px;
      text-align: justify;
    }
    .card-description a {
      color: #1976d2;
      text-decoration: none;
    }
    .card-footer {
      font-size: 10px;
      color: #444;
      margin-bottom: 5px;
      text-align: justify;
    }
    .mb-24 {
      margin-bottom: 16px;
    }
    .text-justify {
      text-align: justify !important;
    }
  </style>
</head>
<body>
  <div id="pdfContent" class="container">
    <div class="bookmark" id="bookmark"></div>
    <div class="header">
      <h1 class="title" id="profileName"></h1>
    </div>
    <div class="content-split">
      <div class="left-panel">
        <div class="section left-section section-1">
          <div class="info-list" id="infoList"></div>
        </div>
        <div class="section left-section section-2">
          <div class="lang-list-block">
            <div class="section-title" id="languageTitle"></div>
            <div class="lang-list" id="langList"></div>
          </div>
        </div>
        <div class="section left-section section-3 left-section-bottom">
          <div class="skills-block">
            <div class="section-title" id="skillsTitle"></div>
            <div class="skills-list" id="skillsList"></div>
          </div>
        </div>
      </div>
      <div class="right-panel">
        <div class="section right-section section-1">
          <div class="content-wrapper">
            <div class="heading" id="summaryTitle"></div>
            <div class="card">
              <div class="card-description" id="aboutMe"></div>
            </div>
          </div>
        </div>
        <div class="section right-section section-2">
          <div class="content-wrapper">
            <div class="heading" id="experienceTitle"></div>
            <div id="experienceList"></div>
          </div>
        </div>
        <div class="section right-section section-3">
          <div class="content-wrapper">
            <div class="heading" id="educationTitle"></div>
            <div id="educationList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import resumeEN from './src/assets/json/resume.en.json';
    import resumeRU from './src/assets/json/resume.ru.json';
    import resumeBG from './src/assets/json/resume.bg.json';
    import resumeFI from './src/assets/json/resume.fi.json';
    import resumeJA from './src/assets/json/resume.ja.json';
    import resumeZH from './src/assets/json/resume.zh.json';

    import i18nEN from './src/assets/i18n/en-US.json';
    import i18nRU from './src/assets/i18n/ru-RU.json';
    import i18nBG from './src/assets/i18n/bg-BG.json';
    import i18nFI from './src/assets/i18n/fi-FI.json';
    import i18nJA from './src/assets/i18n/ja-JA.json';
    import i18nZH from './src/assets/i18n/zh-CH.json';

    const ICONS = {
      EnvelopeIcon: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" /></svg>',
      CakeIcon: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8.25v-1.5m0 1.5c-1.355 0-2.697.056-4.024.166C6.845 8.51 6 9.473 6 10.608v2.513m6-4.871c1.355 0 2.697.056 4.024.166C17.155 8.51 18 9.473 18 10.608v2.513M15 8.25v-1.5m-6 1.5v-1.5m12 9.75l-1.5.75a3.354 3.354 0 01-3 0 3.354 3.354 0 00-3 0 3.354 3.354 0 01-3 0 3.354 3.354 0 00-3 0 3.354 3.354 0 01-3 0L3 16.5m15-3.379a48.474 48.474 0 00-6-.371c-2.032 0-4.034.126-6 .371m12 0c.39.049.777.102 1.163.16 1.07.16 1.837 1.094 1.837 2.175v5.169c0 .621-.504 1.125-1.125 1.125H4.125A1.125 1.125 0 013 20.625v-5.17c0-1.08.768-2.014 1.837-2.174A47.78 47.78 0 016 13.12M12.265 3.11a.375.375 0 11-.53 0L12 2.845l.265.265zm-3 0a.375.375 0 11-.53 0L9 2.845l.265.265zm6 0a.375.375 0 11-.53 0L15 2.845l.265.265z" /></svg>',
      DevicePhoneMobileIcon: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" /></svg>',
      ComputerDesktopIcon: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" /></svg>',
      MapPinIcon: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" /></svg>'
    };

    const DATA_MAP = {
      'en-US': { resume: resumeEN, i18n: i18nEN },
      'ru-RU': { resume: resumeRU, i18n: i18nRU },
      'bg-BG': { resume: resumeBG, i18n: i18nBG },
      'fi-FI': { resume: resumeFI, i18n: i18nFI },
      'ja-JA': { resume: resumeJA, i18n: i18nJA },
      'zh-CH': { resume: resumeZH, i18n: i18nZH }
    };

    let resumeData = null;
    let translations = null;

    function renderResume() {
      if (!resumeData || !translations) return;

      // Bookmark initials
      const name = resumeData.profile.name || '';
      const nameParts = name.split(' ');
      const bookmarkEl = document.getElementById('bookmark');
      bookmarkEl.innerHTML = nameParts.map(part => `<span>${(part[0] || '').toUpperCase()}</span>`).join('');

      // Profile name
      document.getElementById('profileName').textContent = name.toUpperCase();

      // Information section
      const infoList = document.getElementById('infoList');
      infoList.innerHTML = resumeData.information.map(info => {
        const icon = info.icon === 'svg' ? info.svg : (ICONS[info.icon] || '');
        let valueHtml = info.value;

        if (info.icon === 'EnvelopeIcon') {
          valueHtml = `<a href="mailto:${info.value}" class="email-link">${info.value}</a>`;
        } else if (info.icon === 'DevicePhoneMobileIcon') {
          const cleanPhone = info.value.replace(/[^\d+]/g, '');
          valueHtml = `<a href="tel:${cleanPhone}" class="phone-link">${info.value}</a>`;
        }

        return `
          <div class="info-item">
            <span class="info-icon">${icon}</span>
            <div class="info-text text-justify">
              <div class="info-main">${valueHtml}</div>
              <div class="info-label">${info.name}</div>
            </div>
          </div>
        `;
      }).join('');

      // Languages
      document.getElementById('languageTitle').textContent = translations.language || 'Language';
      const langList = document.getElementById('langList');
      langList.innerHTML = resumeData.language.map(lang => `
        <div class="lang-item">
          <span class="lang-avatar">${lang.prefix}</span>
          <div class="lang-info">
            <div class="lang-name">${lang.name}</div>
            <div class="lang-level text-justify">${lang.level}</div>
          </div>
        </div>
      `).join('');

      // Skills
      document.getElementById('skillsTitle').textContent = translations.skills || 'Skills';
      const skillsList = document.getElementById('skillsList');
      skillsList.innerHTML = resumeData.skill.map(skill => `
        <div class="skill-badge">
          <span class="skill-text">${skill}</span>
        </div>
      `).join('');

      // Professional Summary
      document.getElementById('summaryTitle').textContent = resumeData.profile.professionalSummaryTitle || 'Professional Summary';
      document.getElementById('aboutMe').textContent = resumeData.profile.aboutMe || '';

      // Experience
      document.getElementById('experienceTitle').textContent = translations.experience || 'Experience';
      const experienceList = document.getElementById('experienceList');
      experienceList.innerHTML = resumeData.experience.map(exp => `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${exp.job}</div>
            <div class="card-period">${exp.start} ‐ ${exp.end}</div>
          </div>
          <div class="card-subtitle">${exp.company}</div>
          <div class="card-description">${exp.description}</div>
        </div>
      `).join('');

      // Education
      document.getElementById('educationTitle').textContent = translations.education || 'Education';
      const educationList = document.getElementById('educationList');
      educationList.innerHTML = resumeData.education.map(edu => `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${edu.college}</div>
            <div class="card-period">${edu.start} - ${edu.end}</div>
          </div>
          <div class="card-subtitle mb-24">${edu.institution || edu.college}</div>
          ${edu.course ? `<div class="card-footer">${edu.course}</div>` : ''}
        </div>
      `).join('');
    }

    async function generateAndDownloadPdf(lang) {
      const element = document.getElementById('pdfContent');
      const filename = `VadymKuznetsov_${lang}.pdf`;

      const opt = {
        margin: 0,
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      await html2pdf().set(opt).from(element).save();
      window.close();
    }

    // Initialize and auto-download
    const urlParams = new URLSearchParams(window.location.search);
    const lang = urlParams.get('lang') || 'en-US';
    const data = DATA_MAP[lang];

    if (data) {
      resumeData = data.resume;
      translations = data.i18n;
      renderResume();

      // Auto-download after rendering
      setTimeout(() => {
        generateAndDownloadPdf(lang);
      }, 100);
    }
  </script>
</body>
</html>
